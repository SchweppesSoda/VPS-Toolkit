name: PO0 官方防火墙
description: 官方防火墙上报。Token、名称及槽位保存在本机；间隔、定期开关、按网络选择和 SSID 跳过读取当前参数。“PO0 防火墙上报状态”上报并刷新；“查询官方白名单”只读；后台定时和网络变化分别判断触发条件。
author: SchweppesSoda
icon: network

env_schema:
  # ── 官方防火墙参数 ──
  OFFICIAL_TIMER_ENABLED:
    options: ["true", "false"]
    default_value: "true"
    name: "【官方防火墙】启用定期上报"
    description: "关闭后所有官方账号停止定时，网络变化仍可上报。直接读取当前参数，无需保存；本机自动总开关仍独立控制定时和网络变化。"
  OFFICIAL_INTERVAL_SECONDS:
    default_value: "600"
    name: "【官方防火墙】上报间隔（秒）"
    description: "直接读取当前参数，无需保存。范围 60..86400 秒，默认 600；所有本机官方账号使用此间隔并分别计时。旧目标行中的第三列时间不再生效，关闭定时请使用上面的开关。"
  PO0_FIREWALL_TOKENS:
    name: 【官方防火墙】上报目标（Token / 槽位 / 名称）
    description: "每行 Token@槽位|名称，例如 pgnfw_...@0|手机。Token、槽位及名称通过“官方防火墙 · 保存配置”保存在本机，模块同步不会覆盖本机 Token 或槽位。多条用换行、逗号或分号分隔，兼容中文标点；@0..@4 对应第 1..5 槽，同一 Token 只能出现一次。旧第三列时间保留格式兼容，实际间隔和定期开关只读取独立参数。先 DIRECT GET，当前网段已放行则复用，缺失才 POST。"

  OFFICIAL_NETWORK_TARGETS_ENABLED:
    name: 【官方防火墙】按网络选择上报目标
    default_value: "false"
    options: ["false", "true"]
    description: "直接读取当前参数，无需保存。默认关闭，使用本机原目标；开启后蜂窝使用本机原目标，Wi-Fi 使用本机 Wi-Fi 目标。两套目标仍须单独保存到本机，不会随此开关同步覆盖。"
  PO0_FIREWALL_WIFI_TOKENS:
    name: 【官方防火墙】Wi-Fi 上报目标
    description: "填写 Token@槽位|名称，运行“官方防火墙 · 保存配置”保存本机 Wi-Fi 目标。仅开启按网络选择时使用；可与原目标填写同一 Token，各列表内不能重复。留空保留本机旧值，填 - 清空。间隔和定期开关直接读取独立参数。"

  # ── 通用参数 · 直接生效，无需保存 ──
  SKIP_WIFI_SSIDS:
    name: 【通用】跳过上报的 Wi-Fi SSID
    description: "对定时、网络变化、立即上报、上报状态和 Widget 刷新生效。当前 Wi-Fi SSID 命中后不发起官方请求，保留上次结果及下次检查时间。多个 SSID 用英文分号 ; 分隔，精确大小写匹配；读取不到 SSID 时继续正常上报。只有手动执行“仅官方防火墙强制上报”可绕过；“查询官方白名单”只读，不加白。直接读取当前参数，无需保存。SSID 不随官方请求上传。"
  NOTIFY_SUCCESS:
    name: 【通用】自动成功时通知
    default_value: "false"
    options:
      - "true"
      - "false"
  NOTIFY_FAILURE:
    name: 【通用】失败时通知
    default_value: "true"
    options:
      - "true"
      - "false"


scriptings:
# ── 通用 · 查看与手动操作 ──
  - generic:
      name: 查看本机配置
      script_url: "https://raw.githubusercontent.com/SchweppesSoda/VPS-Toolkit/main/scripts/po0/nftables/clients/egern/po0-ssh-ip-report.js?v=20260909-ssid-guard-v1"
      update_interval: 86400
      timeout: 10
      debug: true
  - generic:
      name: PO0 防火墙上报状态
      script_url: "https://raw.githubusercontent.com/SchweppesSoda/VPS-Toolkit/main/scripts/po0/nftables/clients/egern/po0-ssh-ip-report.js?v=20260909-ssid-guard-v1"
      update_interval: 86400
      timeout: 90
      debug: true
  - generic:
      name: 官方防火墙 · 保存配置
      script_url: "https://raw.githubusercontent.com/SchweppesSoda/VPS-Toolkit/main/scripts/po0/nftables/clients/egern/po0-ssh-ip-report.js?v=20260909-ssid-guard-v1"
      update_interval: 86400
      timeout: 10
      debug: true
  - generic:
      name: 启用官方防火墙自动上报
      script_url: "https://raw.githubusercontent.com/SchweppesSoda/VPS-Toolkit/main/scripts/po0/nftables/clients/egern/po0-ssh-ip-report.js?v=20260909-ssid-guard-v1"
      update_interval: 86400
      timeout: 10
      debug: true
  - generic:
      name: 停用官方防火墙自动上报
      script_url: "https://raw.githubusercontent.com/SchweppesSoda/VPS-Toolkit/main/scripts/po0/nftables/clients/egern/po0-ssh-ip-report.js?v=20260909-ssid-guard-v1"
      update_interval: 86400
      timeout: 10
      debug: true
  - generic:
      name: 仅官方防火墙强制上报
      script_url: "https://raw.githubusercontent.com/SchweppesSoda/VPS-Toolkit/main/scripts/po0/nftables/clients/egern/po0-ssh-ip-report.js?v=20260909-ssid-guard-v1"
      update_interval: 86400
      timeout: 90
      debug: true
  - generic:
      name: 查询官方白名单
      script_url: "https://raw.githubusercontent.com/SchweppesSoda/VPS-Toolkit/main/scripts/po0/nftables/clients/egern/po0-ssh-ip-report.js?v=20260909-ssid-guard-v1"
      update_interval: 86400
      timeout: 90
      debug: true
  - generic:
      name: 清除本机 PO0 官方防火墙 Token
      script_url: "https://raw.githubusercontent.com/SchweppesSoda/VPS-Toolkit/main/scripts/po0/nftables/clients/egern/po0-ssh-ip-report.js?v=20260909-ssid-guard-v1"
      update_interval: 86400
      timeout: 10
      debug: true
  - generic:
      name: 查看最近结果
      script_url: "https://raw.githubusercontent.com/SchweppesSoda/VPS-Toolkit/main/scripts/po0/nftables/clients/egern/po0-ssh-ip-report.js?v=20260909-ssid-guard-v1"
      update_interval: 86400
      timeout: 90
      debug: true
  - generic:
      name: 立即上报
      script_url: "https://raw.githubusercontent.com/SchweppesSoda/VPS-Toolkit/main/scripts/po0/nftables/clients/egern/po0-ssh-ip-report.js?v=20260909-ssid-guard-v1"
      update_interval: 86400
      timeout: 90
      debug: true
  - generic:
      name: 仅官方防火墙立即上报
      script_url: "https://raw.githubusercontent.com/SchweppesSoda/VPS-Toolkit/main/scripts/po0/nftables/clients/egern/po0-ssh-ip-report.js?v=20260909-ssid-guard-v1"
      update_interval: 86400
      timeout: 90
      debug: true
# ── 本机维护 ──
  - schedule:
      name: PO0 防火墙定时上报（后台自动）
      cron: "* * * * *"
      script_url: "https://raw.githubusercontent.com/SchweppesSoda/VPS-Toolkit/main/scripts/po0/nftables/clients/egern/po0-ssh-ip-report.js?v=20260909-ssid-guard-v1"
      update_interval: 86400
      timeout: 90
      debug: false
  - network:
      name: PO0 防火墙网络变化上报（后台自动）
      script_url: "https://raw.githubusercontent.com/SchweppesSoda/VPS-Toolkit/main/scripts/po0/nftables/clients/egern/po0-ssh-ip-report.js?v=20260909-ssid-guard-v1"
      update_interval: 86400
      timeout: 90
      debug: false

widgets:
  - name: PO0 防火墙上报状态
    script_name: PO0 防火墙上报状态
