      script_url: "https://raw.githubusercontent.com/SchweppesSoda/VPS-Toolkit/main/scripts/po0/nftables/clients/egern/po0-ssh-ip-report.js?v=20260907-official-ttl"
      update_interval: 86400
      timeout: 10
      debug: true
  - generic:
      name: 启用官方防火墙自动上报
      script_url: "https://raw.githubusercontent.com/SchweppesSoda/VPS-Toolkit/main/scripts/po0/nftables/clients/egern/po0-ssh-ip-report.js?v=20260907-official-ttl"
      update_interval: 86400
      timeout: 10
