name: PO0 出口上报
description: 为当前出口添加防火墙白名单。自建防火墙填写上报目标，官方防火墙填写 Token、槽位和名称；可单独启用，也可一起上报。“启用 / 停用自动上报”只控制定时和网络变化，保留配置；“PO0 防火墙上报状态”执行“上报并刷新”：强制上报两个已配置通道并显示结果；单独上报可运行对应通道的“立即上报”或“强制上报”。标有“后台自动”的两项由 Egern 自动触发，不是手动查看入口。
author: SchweppesSoda
icon: network

env_schema:
  # ── 自建防火墙参数 ──
  SSH_REPORT_TARGETS:
    name: 【自建防火墙】上报目标
    description: "一台或多台都填这里。格式：来源ID|主机|端口|用户|脚本路径|Token|备注|白名单有效期秒数。小组件显示第一列来源 ID，Token 后的备注只用于上报审计。多个目标用换行、逗号、分号或空格分隔。最简示例：{device}|po0.example.com||||TOKEN；目标内填写的值优先，留空才沿用旧配置默认值；没有旧值时用端口 22、用户 root、标准管理脚本、备注 egern 和 TTL 43200 秒。最后一列 TTL 表示停止上报后白名单还能保留多久，默认 43200 秒（12 小时）；每次成功上报重新计时，不是自动上报周期。可在“查看本机配置”核对。填写后运行“自建防火墙 · 保存配置”。"
  PO0_PRIVATE_KEY:
    name: 【自建防火墙】共用 SSH 私钥
    description: '与密码二选一。各目标共用；按原样粘贴私钥，多行、一行 PEM、字面量 \n 均支持。'
  PO0_PASSWORD:
    name: 【自建防火墙】共用 SSH 密码
    description: 与私钥二选一，已填写私钥时优先使用私钥。
  PO0_PASSPHRASE:
    name: 【自建防火墙】SSH 私钥口令
    description: 可选，仅加密私钥需要填写。
  WORKER_TIMER_ENABLED:
    name: 【自建防火墙】启用定期上报
    default_value: "true"
    options: ["true", "false"]
    description: "开启时按下面的间隔定期补报；关闭后仅停止定期检查，网络变化仍可上报。直接读取当前参数，无需保存。两种自动触发都受本机自动总开关和 SSID 跳过控制；手动强制上报和小组件刷新不受此开关限制。"
  AUTO_REPORT_INTERVAL_SECONDS:
    name: 【自建防火墙】上报间隔（秒）
    default_value: "600"
    description: "直接读取当前参数，无需保存。默认 600 秒，范围 60..86400 秒；只在定期开关开启时使用。网段或目标变化、上次失败时会直接上报；本机目标 TTL 快到期时提前续期。"
  CELLULAR_CIDR_PREFIX:
    name: 【自建防火墙】蜂窝网络 CIDR 前缀
    default_value: "24"
    description: "蜂窝网络默认按 /24 上报，减少同一网段内跳 IP 造成的重复上报；设为 32 可关闭。Wi-Fi 和未知网络始终按 /32 上报。"
  DEVICE_ID_SETUP:
    name: 【自建防火墙】本机设备 ID
    description: "填写后运行“保存本机设备 ID”。上报目标中的 {device} 会使用本机已保存的 ID，来源 ID 和备注均支持。示例：iphone15pm。"

  # ── 官方防火墙参数 ──
  OFFICIAL_TIMER_ENABLED:
    options: ["true", "false"]
    default_value: "true"
    name: "【官方防火墙】启用定期上报"
    description: "关闭后所有官方账号停止定时，网络变化仍可上报。直接读取当前参数，无需保存；本机自动总开关仍独立控制定时和网络变化。"
  OFFICIAL_INTERVAL_SECONDS:
    default_value: "600"
    name: "【官方防火墙】上报间隔（秒）"
    description: "直接读取当前参数，无需保存。范围 60..86400 秒，默认 600；所有本机官方账号使用此间隔并分别计时。旧目标行中的第三列时间不再生效，关闭定时请使用上面的开关。"
  PO0_FIREWALL_TOKENS:
    name: 【官方防火墙】上报目标（Token / 槽位 / 名称）
    description: "每行 Token@槽位|名称，例如 pgnfw_...@0|手机。Token、槽位及名称通过“官方防火墙 · 保存配置”保存在本机，模块同步不会覆盖本机 Token 或槽位。多条用换行、逗号或分号分隔，兼容中文标点；@0..@4 对应第 1..5 槽，同一 Token 只能出现一次。旧第三列时间保留格式兼容，实际间隔和定期开关只读取独立参数。先 DIRECT GET，当前网段已放行则复用，缺失才 POST。"

  OFFICIAL_NETWORK_TARGETS_ENABLED:
    name: 【官方防火墙】按网络选择上报目标
    default_value: "false"
    options: ["false", "true"]
    description: "直接读取当前参数，无需保存。默认关闭，使用本机原目标；开启后蜂窝使用本机原目标，Wi-Fi 使用本机 Wi-Fi 目标。两套目标仍须单独保存到本机，不会随此开关同步覆盖。"
  PO0_FIREWALL_WIFI_TOKENS:
    name: 【官方防火墙】Wi-Fi 上报目标
    description: "填写 Token@槽位|名称，运行“官方防火墙 · 保存配置”保存本机 Wi-Fi 目标。仅开启按网络选择时使用；可与原目标填写同一 Token，各列表内不能重复。留空保留本机旧值，填 - 清空。间隔和定期开关直接读取独立参数。"

  # ── 通用参数 · 直接生效，无需保存 ──
  SKIP_WIFI_SSIDS:
    name: 【通用】跳过上报的 Wi-Fi SSID
    description: "可选。对自动触发及“立即上报”生效；当前 Wi-Fi SSID 命中后，本机跳过本次公网 IP 探测、SSH 和官方上报。多个 SSID 用英文分号 ; 分隔，精确大小写匹配；读取不到 SSID 时继续正常上报。立即上报仍遵守 SSID 跳过；强制上报和 Widget 刷新会继续上报。SSID 只保存在 Egern 本地状态/日志，不上传到 PO0 或 LAN Worker。"
  IP_CHECK_URL:
    name: 【通用】IPv4 探测 URL
    default_value: "https://ip9.com.cn/get"
    description: 第一个公网 IPv4 探测地址。默认会轮询 IP9、国内接口和 myip.ipip.net。
  IP_CHECK_URLS:
    name: 【通用】IPv4 探测 URL 列表
    description: 可选。用逗号分隔，覆盖完整轮询探测地址列表。
  POLICY:
    name: 【通用】Egern 策略
    default_value: DIRECT
  NOTIFY_SUCCESS:
    name: 【通用】自动成功时通知
    default_value: "false"
    options:
      - "true"
      - "false"
  NOTIFY_FAILURE:
    name: 【通用】失败时通知
    default_value: "true"
    options:
      - "true"
      - "false"


scriptings:
# ── 通用 · 查看与手动操作 ──
  - generic:
      name: 查看本机配置
      script_url: "https://raw.githubusercontent.com/SchweppesSoda/VPS-Toolkit/main/scripts/po0/nftables/clients/egern/po0-ssh-ip-report.js?v=20260907-local-targets-live-options-v1"
      update_interval: 86400
      timeout: 10
      debug: true
  - generic:
      name: PO0 防火墙上报状态
      script_url: "https://raw.githubusercontent.com/SchweppesSoda/VPS-Toolkit/main/scripts/po0/nftables/clients/egern/po0-ssh-ip-report.js?v=20260907-local-targets-live-options-v1"
