name: PO0 防火墙上报
description: 为当前出口添加防火墙白名单。自建防火墙填写上报目标，官方防火墙填写 Token、槽位和名称；可单独启用，也可一起上报。“启用 / 停用自动上报”只控制定时和网络变化，保留配置；“PO0 防火墙上报状态”刷新时强制上报两个已配置通道并显示结果；单独上报请运行对应通道的“强制上报”。标有“后台自动”的两项由 Egern 自动触发，不是手动查看入口。
author: SchweppesSoda
icon: network

env_schema:
  # ── 自建防火墙参数 ──
  SSH_REPORT_TARGETS:
    name: 【自建防火墙】上报目标
    description: "一台或多台都填这里。格式：来源ID|主机|端口|用户|脚本路径|Token|备注|TTL。小组件显示第一列来源 ID，Token 后的备注只用于上报审计。多个目标用换行、逗号、分号或空格分隔。最简示例：{device}|po0.example.com||||TOKEN；目标内填写的值优先，留空才沿用旧配置默认值；没有旧值时用端口 22、用户 root、标准管理脚本、备注 egern 和 TTL 43200 秒。每条目标的生效 TTL 可在“查看本机上报设置”核对。填写后运行“保存本机 PO0 自建防火墙配置”。"
  PO0_PRIVATE_KEY:
    name: 【自建防火墙】共用 SSH 私钥
    description: '与密码二选一。各目标共用；按原样粘贴私钥，多行、一行 PEM、字面量 \n 均支持。'
  PO0_PASSWORD:
    name: 【自建防火墙】共用 SSH 密码
    description: 与私钥二选一，已填写私钥时优先使用私钥。
  PO0_PASSPHRASE:
    name: 【自建防火墙】SSH 私钥口令
    description: 可选，仅加密私钥需要填写。
  WORKER_TIMER_ENABLED:
    name: 【自建防火墙】启用定时兜底
    default_value: "true"
    options: ["true", "false"]
    description: "关闭后仍响应网络变化；保存自建设置后生效。"
  AUTO_REPORT_INTERVAL_SECONDS:
    name: 【自建防火墙】自动上报周期秒数
    default_value: "600"
    description: "范围 60..86400 秒，默认 600 秒，建议小于目标 TTL。定时可独立关闭；网络变化立即上报；出口网段或目标变化、强制上报和状态刷新会立即上报，TTL 较短时会提前续期。"
  CELLULAR_CIDR_PREFIX:
    name: 【自建防火墙】蜂窝网络 CIDR 前缀
    default_value: "24"
    description: "蜂窝网络默认按 /24 上报，减少同一网段内跳 IP 造成的重复上报；设为 32 可关闭。Wi-Fi 和未知网络始终按 /32 上报。"
  DEVICE_ID_SETUP:
    name: 【自建防火墙】本机设备 ID
    description: "填写后运行“保存本机设备 ID”。上报目标中的 {device} 会使用本机已保存的 ID，来源 ID 和备注均支持。示例：iphone15pm。"

  # ── 官方防火墙参数 ──
  OFFICIAL_TIMER_ENABLED:
    options: ["true", "false"]
    default_value: "true"
    name: "【官方防火墙】启用定时兜底"
    description: "关闭后所有官方账号停止定时，但仍响应网络变化；保存官方设置后生效。"
  OFFICIAL_INTERVAL_SECONDS:
    default_value: "600"
    name: "【官方防火墙】默认 TTL（上报周期秒数）"
    description: "60..86400 秒，默认 600；目标第三列 TTL 留空时沿用此值。TTL 在这里指客户端上报周期，不改变官方白名单有效期；网络变化立即检查，保存后生效。"
  PO0_FIREWALL_TOKENS:
    name: 【官方防火墙】上报目标（Token / 槽位 / 名称 / TTL）
    description: "每个目标写为 Token@槽位|名称|TTL秒数，例如 pgnfw_...@0|自定义名称|600。名称是自己填写的小组件显示标签，可含空格；名称和 TTL 均可留空。TTL 直接写数字，范围 60..86400 秒，留空沿用默认值（默认 600）；填 0 只关闭此目标定时，网络变化仍检查。这里 TTL 只控制客户端上报周期，不改变官方白名单有效期。无需另写参数名或定时开关。多条用换行、逗号或分号分隔（兼容中文标点）；@0..@4 对应第 1..5 槽，同一 Token 只能出现一次。旧纯 Token 列表继续兼容。填写后运行“保存本机 PO0 官方防火墙配置”；同步参数不会覆盖本机保存的槽位和 TTL。先 DIRECT GET，缺失或槽位不符才 POST。"

  PO0_FIREWALL_NAMES:
    name: 【官方防火墙】目标名称（兼容旧配置）
    description: "推荐把名称写在上报目标的第二列；此项继续兼容旧配置，目标行内非空名称优先。小组件和状态页显示此名称，修改后刷新生效。多个名称按 Token 顺序用逗号、分号或换行分隔，名称内可含空格。Token 留空时对应本机已保存账号顺序；运行“保存本机 PO0 官方防火墙配置”可持久保存，只改名称无需重填 Token。空白沿用本机名称，填 - 清空名称。"

  # ── 通用参数 ──
  SKIP_WIFI_SSIDS:
    name: 【通用】跳过上报的 Wi-Fi SSID
    description: "可选。仅对定时/网络变化自动触发生效；当前 Wi-Fi SSID 命中后，本机跳过本次公网 IP 探测、SSH 和官方上报。多个 SSID 用英文分号 ; 分隔，精确大小写匹配；读取不到 SSID 时继续正常上报。手动运行、状态页和 Widget 刷新会强制继续上报。SSID 只保存在 Egern 本地状态/日志，不上传到 PO0 或 LAN Worker。"
  IP_CHECK_URL:
    name: 【通用】IPv4 探测 URL
    default_value: "https://ip9.com.cn/get"
    description: 第一个公网 IPv4 探测地址。默认会轮询 IP9、国内接口和 myip.ipip.net。
  IP_CHECK_URLS:
    name: 【通用】IPv4 探测 URL 列表
    description: 可选。用逗号分隔，覆盖完整轮询探测地址列表。
  POLICY:
    name: 【通用】Egern 策略
    default_value: DIRECT
  NOTIFY_SUCCESS:
    name: 【通用】自动成功时通知
    default_value: "false"
    options:
      - "true"
      - "false"
  NOTIFY_FAILURE:
    name: 【通用】失败时通知
    default_value: "true"
    options:
      - "true"
      - "false"


scriptings:
# ── 通用 · 查看与手动操作 ──
  - generic:
      name: 查看本机上报设置
      script_url: "https://raw.githubusercontent.com/SchweppesSoda/VPS-Toolkit/main/scripts/po0/nftables/clients/egern/po0-ssh-ip-report.js?v=20260907-official-ttl"
      update_interval: 86400
      timeout: 10
      debug: true
  - generic:
      name: PO0 防火墙上报状态
      script_url: "https://raw.githubusercontent.com/SchweppesSoda/VPS-Toolkit/main/scripts/po0/nftables/clients/egern/po0-ssh-ip-report.js?v=20260907-official-ttl"
      update_interval: 86400
      timeout: 90
      debug: true
# ── 自建防火墙 · 保存 / 开关 / 上报 / 清除 ──
