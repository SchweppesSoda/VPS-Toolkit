name: PO0 出口上报
description: 为当前出口添加防火墙白名单。自建防火墙填写上报目标，官方防火墙填写 Token、槽位和名称；可单独启用，也可一起上报。“启用 / 停用自动上报”只控制定时和网络变化，保留配置；“PO0 防火墙上报状态”执行“上报并刷新”：强制上报两个已配置通道并显示结果；单独上报可运行对应通道的“立即上报”或“强制上报”。标有“后台自动”的两项由 Egern 自动触发，不是手动查看入口。
author: SchweppesSoda
icon: network

env_schema:
  # ── 自建防火墙参数 ──
  SSH_REPORT_TARGETS:
    name: 【自建防火墙】上报目标
    description: "一台或多台都填这里。格式：来源ID|主机|端口|用户|脚本路径|Token|备注|白名单有效期秒数。小组件显示第一列来源 ID，Token 后的备注只用于上报审计。多个目标用换行、逗号、分号或空格分隔。最简示例：{device}|po0.example.com||||TOKEN；目标内填写的值优先，留空才沿用旧配置默认值；没有旧值时用端口 22、用户 root、标准管理脚本、备注 egern 和 TTL 43200 秒。最后一列 TTL 表示停止上报后白名单还能保留多久，默认 43200 秒（12 小时）；每次成功上报重新计时，不是自动上报周期。可在“查看本机配置”核对。填写后运行“自建防火墙 · 保存配置”。"
  PO0_PRIVATE_KEY:
    name: 【自建防火墙】共用 SSH 私钥
    description: '与密码二选一。各目标共用；按原样粘贴私钥，多行、一行 PEM、字面量 \n 均支持。'
  PO0_PASSWORD:
    name: 【自建防火墙】共用 SSH 密码
    description: 与私钥二选一，已填写私钥时优先使用私钥。
  PO0_PASSPHRASE:
    name: 【自建防火墙】SSH 私钥口令
    description: 可选，仅加密私钥需要填写。
  WORKER_TIMER_ENABLED:
    name: 【自建防火墙】启用定期上报
    default_value: "true"
    options: ["true", "false"]
    description: "开启：即使网络没切换，也会按下面的间隔定期补报。关闭：停止定期检查，下面的间隔暂不使用；Wi-Fi/蜂窝网络切换仍会立即上报。两者都受自建自动上报总开关和 SSID 跳过名单控制。手动强制上报、刷新小组件不受此开关限制。修改后运行“自建防火墙 · 保存配置”。"
  AUTO_REPORT_INTERVAL_SECONDS:
    name: 【自建防火墙】上报间隔（秒）
    default_value: "600"
    description: "仅在上面的定期上报开关开启时生效。默认 600 秒（10 分钟），范围 60..86400 秒：出口网段不变时，距离上次成功上报达到此间隔才补报。Egern 每分钟检查一次；发现网段/目标变化或上次失败时会直接上报，白名单快到期时也会提前续期。网络切换、手动强制上报和刷新小组件无需等到间隔结束。"
  CELLULAR_CIDR_PREFIX:
    name: 【自建防火墙】蜂窝网络 CIDR 前缀
    default_value: "24"
    description: "蜂窝网络默认按 /24 上报，减少同一网段内跳 IP 造成的重复上报；设为 32 可关闭。Wi-Fi 和未知网络始终按 /32 上报。"
  DEVICE_ID_SETUP:
    name: 【自建防火墙】本机设备 ID
    description: "填写后运行“保存本机设备 ID”。上报目标中的 {device} 会使用本机已保存的 ID，来源 ID 和备注均支持。示例：iphone15pm。"

  # ── 官方防火墙参数 ──
  OFFICIAL_TIMER_ENABLED:
    options: ["true", "false"]
    default_value: "true"
    name: "【官方防火墙】启用定期上报"
    description: "关闭后所有官方账号停止定时，但仍响应网络变化；保存官方设置后生效。"
  OFFICIAL_INTERVAL_SECONDS:
    default_value: "600"
    name: "【官方防火墙】上报间隔（秒）"
    description: "60..86400 秒，默认 600；目标第三列上报间隔留空时沿用此值。这是客户端上报间隔；白名单有效期（TTL）由官方服务管理；网络变化立即检查，保存后生效。"
  PO0_FIREWALL_TOKENS:
    name: 【官方防火墙】上报目标（Token / 槽位 / 名称 / 上报间隔）
    description: "每个目标写为 Token@槽位|名称|上报间隔秒数，例如 pgnfw_...@0|自定义名称|600。名称是自己填写的小组件显示标签，可含空格；名称和上报间隔均可留空。上报间隔直接写数字，范围 60..86400 秒，留空沿用默认值（默认 600）；填 0 只关闭此目标定时，网络变化仍检查。此列只控制上报间隔，白名单有效期（TTL）由官方服务管理。无需另写参数名或定时开关。多条用换行、逗号或分号分隔（兼容中文标点）；@0..@4 对应第 1..5 槽，同一 Token 只能出现一次。旧纯 Token 列表继续兼容。填写后运行“官方防火墙 · 保存配置”；同步参数不会覆盖本机保存的槽位和上报间隔。先 DIRECT GET；当前 /24 网段已在白名单时直接复用，位于其他槽位则显示共用；未加白才 POST 到配置槽位。新设备共用同一出口无需另占槽位。"

  # ── 通用参数 · 修改后运行“通用设置 · 保存配置” ──
  SKIP_WIFI_SSIDS:
    name: 【通用】跳过上报的 Wi-Fi SSID
    description: "可选。对自动触发及“立即上报”生效；当前 Wi-Fi SSID 命中后，本机跳过本次公网 IP 探测、SSH 和官方上报。多个 SSID 用英文分号 ; 分隔，精确大小写匹配；读取不到 SSID 时继续正常上报。立即上报仍遵守 SSID 跳过；强制上报和 Widget 刷新会继续上报。SSID 只保存在 Egern 本地状态/日志，不上传到 PO0 或 LAN Worker。"
  IP_CHECK_URL:
    name: 【通用】IPv4 探测 URL
    default_value: "https://ip9.com.cn/get"
    description: 第一个公网 IPv4 探测地址。默认会轮询 IP9、国内接口和 myip.ipip.net。
  IP_CHECK_URLS:
    name: 【通用】IPv4 探测 URL 列表
    description: 可选。用逗号分隔，覆盖完整轮询探测地址列表。
  POLICY:
    name: 【通用】Egern 策略
    default_value: DIRECT
  NOTIFY_SUCCESS:
    name: 【通用】自动成功时通知
    default_value: "false"
    options:
      - "true"
      - "false"
  NOTIFY_FAILURE:
    name: 【通用】失败时通知
    default_value: "true"
    options:
      - "true"
      - "false"


scriptings:
# ── 通用 · 查看与手动操作 ──
  - generic:
      name: 查看本机配置
      script_url: "https://raw.githubusercontent.com/SchweppesSoda/VPS-Toolkit/main/scripts/po0/nftables/clients/egern/po0-ssh-ip-report.js?v=20260907-unified-reporting"
      update_interval: 86400
      timeout: 10
      debug: true
  - generic:
      name: PO0 防火墙上报状态
      script_url: "https://raw.githubusercontent.com/SchweppesSoda/VPS-Toolkit/main/scripts/po0/nftables/clients/egern/po0-ssh-ip-report.js?v=20260907-unified-reporting"
