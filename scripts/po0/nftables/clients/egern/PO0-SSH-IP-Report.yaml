name: PO0 防火墙上报
description: 为当前出口添加防火墙白名单。自建防火墙填写上报目标，官方防火墙填写 Token；可单独启用，也可一起上报。“启用 / 停用自动上报”只控制定时和网络变化，保留配置；手动上报和小组件刷新仍可执行。
author: SchweppesSoda
icon: network

env_schema:
  # ── 自建防火墙参数 ──
  SSH_REPORT_TARGETS:
    name: 【自建防火墙】上报目标
    description: "一台或多台都填这里。格式：来源ID|主机|端口|用户|脚本路径|Token|备注|TTL。多个目标用换行、逗号、分号或空格分隔。最简示例：{device}|po0.example.com||||TOKEN；省略项默认使用端口 22、用户 root、标准管理脚本、备注 egern 和 TTL 43200 秒。填写后运行“保存本机 PO0 自建防火墙配置”。"
  PO0_PRIVATE_KEY:
    name: 【自建防火墙】共用 SSH 私钥
    description: '与密码二选一。各目标共用；按原样粘贴私钥，多行、一行 PEM、字面量 \n 均支持。'
  PO0_PASSWORD:
    name: 【自建防火墙】共用 SSH 密码
    description: 与私钥二选一，已填写私钥时优先使用私钥。
  PO0_PASSPHRASE:
    name: 【自建防火墙】SSH 私钥口令
    description: 可选，仅加密私钥需要填写。
  AUTO_REPORT_INTERVAL_SECONDS:
    name: 【自建防火墙】自动上报周期秒数
    default_value: "3600"
    description: "范围 600..86400 秒，建议小于目标 TTL。模块每 10 分钟检查一次；出口网段或目标变化、强制上报和状态刷新会立即上报，TTL 较短时会提前续期。"
  CELLULAR_CIDR_PREFIX:
    name: 【自建防火墙】蜂窝网络 CIDR 前缀
    default_value: "24"
    description: "蜂窝网络默认按 /24 上报，减少同一网段内跳 IP 造成的重复上报；设为 32 可关闭。Wi-Fi 和未知网络始终按 /32 上报。"
  DEVICE_ID_SETUP:
    name: 【自建防火墙】本机设备 ID
    description: "填写后运行“保存本机设备 ID”。上报目标中的 {device} 会使用本机已保存的 ID，来源 ID 和备注均支持。示例：iphone15pm。"

  # ── 官方防火墙参数 ──
  PO0_FIREWALL_TOKENS:
    name: 【官方防火墙】Token / 槽位
    description: "仅保存到官方配置：填写后运行“保存本机 PO0 官方防火墙配置”。检查周期固定为 600 秒。默认关闭。多个官方账号可用逗号、分号、空格或换行分隔（兼容中文逗号、分号），格式为 pgnfw_... 或 pgnfw_...@0 到 @4；同一 token 即使指定不同槽位也只能配置一次，以避免并发竞态。每个账号最多占用一个固定槽位。配置/API 槽位为 0..4，界面显示为第 1..5 槽。Egern 直接用 DIRECT 请求官方 API，先 GET 检查，当前出口缺失或槽位不对时才 POST 加白。强制上报、普通状态页和 Widget 刷新均执行此流程；只有“PO0 官方防火墙状态（只读）”不加白。"

  PO0_FIREWALL_NAMES:
    name: 【官方防火墙】目标名称
    description: "仅本机显示。与 Token 顺序对应，名称之间用分号或换行分隔，名称内可含空格。填 - 清空名称；修改后运行“保存本机 PO0 官方防火墙配置”。检查周期固定 600 秒；放行 TTL 由官方服务管理。"

  # ── 通用参数 ──
  SKIP_WIFI_SSIDS:
    name: 【通用】跳过上报的 Wi-Fi SSID
    description: "可选。仅对定时/网络变化自动触发生效；当前 Wi-Fi SSID 命中后，本机跳过本次公网 IP 探测、SSH 和官方上报。多个 SSID 用英文分号 ; 分隔，精确大小写匹配；读取不到 SSID 时继续正常上报。手动运行、状态页和 Widget 刷新会强制继续上报。SSID 只保存在 Egern 本地状态/日志，不上传到 PO0 或 LAN Worker。"
  IP_CHECK_URL:
    name: 【通用】IPv4 探测 URL
    default_value: "https://ip9.com.cn/get"
    description: 第一个公网 IPv4 探测地址。默认会轮询 IP9、国内接口和 myip.ipip.net。
  IP_CHECK_URLS:
    name: 【通用】IPv4 探测 URL 列表
    description: 可选。用逗号分隔，覆盖完整轮询探测地址列表。
  POLICY:
    name: 【通用】Egern 策略
    default_value: DIRECT
  NOTIFY_SUCCESS:
    name: 【通用】自动成功时通知
    default_value: "false"
    options:
      - "true"
      - "false"
  NOTIFY_FAILURE:
    name: 【通用】失败时通知
    default_value: "true"
    options:
      - "true"
      - "false"


scriptings:
# ── 通用 · 查看与手动操作 ──
  - generic:
      name: 查看本机上报设置
      script_url: "https://raw.githubusercontent.com/SchweppesSoda/VPS-Toolkit/main/scripts/po0/nftables/clients/egern/po0-ssh-ip-report.js?v=20260906-widget-fix"
      update_interval: 86400
      timeout: 10
      debug: true
  - generic:
      name: 强制上报 PO0 防火墙
      script_url: "https://raw.githubusercontent.com/SchweppesSoda/VPS-Toolkit/main/scripts/po0/nftables/clients/egern/po0-ssh-ip-report.js?v=20260906-widget-fix"
      update_interval: 86400
      timeout: 90
      debug: true
  - generic:
      name: PO0 防火墙上报状态
      script_url: "https://raw.githubusercontent.com/SchweppesSoda/VPS-Toolkit/main/scripts/po0/nftables/clients/egern/po0-ssh-ip-report.js?v=20260906-widget-fix"
      update_interval: 86400
      timeout: 90
      debug: true
# ── 自建防火墙 · 保存 / 开关 / 上报 / 清除 ──
  - generic:
      name: 保存本机 PO0 自建防火墙配置
      script_url: "https://raw.githubusercontent.com/SchweppesSoda/VPS-Toolkit/main/scripts/po0/nftables/clients/egern/po0-ssh-ip-report.js?v=20260906-widget-fix"
      update_interval: 86400
      timeout: 10
      debug: true
  - generic:
      name: 启用自建防火墙自动上报
      script_url: "https://raw.githubusercontent.com/SchweppesSoda/VPS-Toolkit/main/scripts/po0/nftables/clients/egern/po0-ssh-ip-report.js?v=20260906-widget-fix"
      update_interval: 86400
      timeout: 10
      debug: true
  - generic:
      name: 停用自建防火墙自动上报
      script_url: "https://raw.githubusercontent.com/SchweppesSoda/VPS-Toolkit/main/scripts/po0/nftables/clients/egern/po0-ssh-ip-report.js?v=20260906-widget-fix"
      update_interval: 86400
      timeout: 10
      debug: true
  - generic:
      name: 仅自建防火墙强制上报
      script_url: "https://raw.githubusercontent.com/SchweppesSoda/VPS-Toolkit/main/scripts/po0/nftables/clients/egern/po0-ssh-ip-report.js?v=20260906-widget-fix"
      update_interval: 86400
      timeout: 90
      debug: true
  - generic:
      name: 清除本机自建防火墙配置
      script_url: "https://raw.githubusercontent.com/SchweppesSoda/VPS-Toolkit/main/scripts/po0/nftables/clients/egern/po0-ssh-ip-report.js?v=20260906-widget-fix"
      update_interval: 86400
      timeout: 10
      debug: true
# ── 官方防火墙 · 保存 / 开关 / 上报 / 状态 / 清除 ──
  - generic:
      name: 保存本机 PO0 官方防火墙配置
      script_url: "https://raw.githubusercontent.com/SchweppesSoda/VPS-Toolkit/main/scripts/po0/nftables/clients/egern/po0-ssh-ip-report.js?v=20260906-widget-fix"
      update_interval: 86400
      timeout: 10
      debug: true
  - generic:
      name: 启用官方防火墙自动上报
      script_url: "https://raw.githubusercontent.com/SchweppesSoda/VPS-Toolkit/main/scripts/po0/nftables/clients/egern/po0-ssh-ip-report.js?v=20260906-widget-fix"
      update_interval: 86400
      timeout: 10
      debug: true
  - generic:
      name: 停用官方防火墙自动上报
      script_url: "https://raw.githubusercontent.com/SchweppesSoda/VPS-Toolkit/main/scripts/po0/nftables/clients/egern/po0-ssh-ip-report.js?v=20260906-widget-fix"
      update_interval: 86400
      timeout: 10
      debug: true
  - generic:
      name: 仅官方防火墙强制上报
      script_url: "https://raw.githubusercontent.com/SchweppesSoda/VPS-Toolkit/main/scripts/po0/nftables/clients/egern/po0-ssh-ip-report.js?v=20260906-widget-fix"
      update_interval: 86400
      timeout: 90
      debug: true
  - generic:
      name: PO0 官方防火墙状态（只读）
      script_url: "https://raw.githubusercontent.com/SchweppesSoda/VPS-Toolkit/main/scripts/po0/nftables/clients/egern/po0-ssh-ip-report.js?v=20260906-widget-fix"
      update_interval: 86400
      timeout: 90
      debug: true
  - generic:
      name: 清除本机 PO0 官方防火墙 Token
      script_url: "https://raw.githubusercontent.com/SchweppesSoda/VPS-Toolkit/main/scripts/po0/nftables/clients/egern/po0-ssh-ip-report.js?v=20260906-widget-fix"
      update_interval: 86400
      timeout: 10
      debug: true
# ── 兼容已有自建小组件的脚本绑定，不用于新建 ──
  - generic:
      name: PO0 SSH 上报状态
      script_url: "https://raw.githubusercontent.com/SchweppesSoda/VPS-Toolkit/main/scripts/po0/nftables/clients/egern/po0-ssh-ip-report.js?v=20260906-widget-fix"
      update_interval: 86400
      timeout: 90
      debug: true
# ── 本机维护 ──
  - generic:
      name: 保存本机设备 ID
      script_url: "https://raw.githubusercontent.com/SchweppesSoda/VPS-Toolkit/main/scripts/po0/nftables/clients/egern/po0-ssh-ip-report.js?v=20260906-widget-fix"
      update_interval: 86400
      timeout: 10
      debug: true
  - generic:
      name: 清除本机设备 ID
      script_url: "https://raw.githubusercontent.com/SchweppesSoda/VPS-Toolkit/main/scripts/po0/nftables/clients/egern/po0-ssh-ip-report.js?v=20260906-widget-fix"
      update_interval: 86400
      timeout: 10
      debug: true
  - generic:
      name: 清除本机全部 PO0 上报配置
      script_url: "https://raw.githubusercontent.com/SchweppesSoda/VPS-Toolkit/main/scripts/po0/nftables/clients/egern/po0-ssh-ip-report.js?v=20260906-widget-fix"
      update_interval: 86400
      timeout: 10
      debug: true
  - http_request:
      name: PO0 防火墙本机设备 ID
      match: "^http://po0-egern\\.local/"
      script_url: "https://raw.githubusercontent.com/SchweppesSoda/VPS-Toolkit/main/scripts/po0/nftables/clients/egern/po0-ssh-ip-report.js?v=20260906-widget-fix"
      update_interval: 86400
      timeout: 10
      body_required: false
      debug: true
# ── 自动触发 · 两个已配置且启用的通道共用 ──
  - schedule:
      name: PO0 防火墙定时上报
      cron: "*/10 * * * *"
      script_url: "https://raw.githubusercontent.com/SchweppesSoda/VPS-Toolkit/main/scripts/po0/nftables/clients/egern/po0-ssh-ip-report.js?v=20260906-widget-fix"
      update_interval: 86400
      timeout: 90
      debug: false
  - network:
      name: PO0 防火墙网络变化上报
      script_url: "https://raw.githubusercontent.com/SchweppesSoda/VPS-Toolkit/main/scripts/po0/nftables/clients/egern/po0-ssh-ip-report.js?v=20260906-widget-fix"
      update_interval: 86400
      timeout: 90
      debug: false

widgets:
  - name: PO0 防火墙上报状态
    script_name: PO0 防火墙上报状态
  # 保留已添加到桌面的旧名称，统一使用当前上报逻辑。
  - name: PO0 SSH 上报状态
    script_name: PO0 防火墙上报状态
