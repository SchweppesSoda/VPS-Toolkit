name: PO0 SSH IP Report
description: Report the current Egern/mobile outbound IPv4 to PO0 over restricted SSH report. PO0 does not expose HTTP.
author: SchweppesSoda
icon: network

env_schema:
  PO0_HOST:
    name: PO0 SSH host
    description: Single-target PO0 server hostname or IP for SSH. Leave it empty when SSH_REPORT_TARGETS is used.
  PO0_PORT:
    name: PO0 SSH port
    default_value: "22"
  PO0_USER:
    name: PO0 SSH user
    default_value: root
  PO0_PASSWORD:
    name: PO0 SSH password
    description: Use either password or private key.
  PO0_PRIVATE_KEY:
    name: PO0 SSH private key
    description: 'Paste the key as-is. Multi-line, one-line PEM, and literal \n are normalized automatically.'
  PO0_PASSPHRASE:
    name: PO0 SSH key passphrase
    description: Optional. Only needed when the private key is encrypted.
  PO0_SCRIPT:
    name: PO0 manager script path
    default_value: /root/nftables-relay-manager.sh
  SSH_REPORT_SOURCE:
    name: SSH report source ID
    default_value: egern
    description: Source ID shown on PO0, for example iphone or ipad-cellular.
  SSH_REPORT_TOKEN:
    name: SSH report token
    description: Single-target token shown by PO0 --show-client-deploy-commands or the source allowlist menu. Leave it empty when each SSH_REPORT_TARGETS line has its own token.
  REPORT_IDENTITY:
    name: Optional identity
    default_value: egern
  TTL_SECONDS:
    name: Allowlist TTL seconds
    default_value: "3600"
  SSH_REPORT_TARGETS:
    name: Multiple PO0 targets
    description: "Optional. Separate targets with a newline, comma, semicolon, or space: source_id|host|port|user|script|token|identity|ttl. When set, the module reports the same current IPv4 to every target."
  IP_CHECK_URL:
    name: IPv4 check URL
    default_value: "https://ip9.com.cn/get"
    description: First IPv4 check URL. The script rotates through IP9, domestic APIs, and myip.ipip.net by default.
  IP_CHECK_URLS:
    name: IPv4 check URL list
    description: Optional comma-separated override for the full rotating URL list.
  POLICY:
    name: Egern policy
    default_value: DIRECT
  NOTIFY_SUCCESS:
    name: Notify automatic success
    default_value: "false"
    options:
      - "true"
      - "false"
  NOTIFY_FAILURE:
    name: Notify failure
    default_value: "true"
    options:
      - "true"
      - "false"

scriptings:
  - schedule:
      name: PO0 SSH IP Report
      cron: "*/10 * * * *"
      script_url: "https://raw.githubusercontent.com/SchweppesSoda/VPS-Toolkit/main/scripts/po0/nftables/clients/egern/po0-ssh-ip-report.js"
      update_interval: 86400
      timeout: 30
      debug: false
  - network:
      name: PO0 SSH Report Network Change
      script_url: "https://raw.githubusercontent.com/SchweppesSoda/VPS-Toolkit/main/scripts/po0/nftables/clients/egern/po0-ssh-ip-report.js"
      update_interval: 86400
      timeout: 30
      debug: false
  - generic:
      name: PO0 SSH IP Report Now
      script_url: "https://raw.githubusercontent.com/SchweppesSoda/VPS-Toolkit/main/scripts/po0/nftables/clients/egern/po0-ssh-ip-report.js"
      update_interval: 86400
      timeout: 30
      debug: true
  - generic:
      name: PO0 SSH Report Status
      script_url: "https://raw.githubusercontent.com/SchweppesSoda/VPS-Toolkit/main/scripts/po0/nftables/clients/egern/po0-ssh-ip-report.js"
      update_interval: 86400
      timeout: 30
      debug: true

widgets:
  - name: PO0 SSH Report Status
    script_name: PO0 SSH Report Status
