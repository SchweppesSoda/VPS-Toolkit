# 复制为实例专用 inventory 后再填写。配置按字面解析，不执行 shell 展开。
# 本示例引用带占位符的 .example 文件，故意不能直接 deploy。
# 正式实例必须改用私有文件名、填写实际服务 inventory，并替换每个 enabled 组件的 SHA。
# 下面三个 SHA 占位符故意不是 64 位十六进制值，因此本示例无法通过 validate/deploy。
STACK_INVENTORY_VERSION=1

# managed：由 services.tsv 生成整机 input policy；external：只编排服务，不碰主机防火墙。
HOST_FIREWALL_MODE=managed
HOST_FIREWALL_POLICY=drop
HOST_FIREWALL_PERSIST=1
HOST_FIREWALL_ALLOW_ICMP=1
REMOTE_ADMIN_SERVICE=ssh
SERVICES_FILE=services.example.tsv

ARGOSBX_ENABLED=1
ARGOSBX_SOURCE_URL=https://raw.githubusercontent.com/yonggekkk/argosbx/main/argosbx.sh
ARGOSBX_SOURCE_SHA256=<replace-with-reviewed-64-hex-sha256>
ARGOSBX_VARIABLES_FILE=argosbx.example.env
ARGOSBX_EXISTING_ACTION=skip

PDG_ENABLED=1
PDG_INSTALL_URL=https://raw.githubusercontent.com/SchweppesSoda/proxy-gateway-plus/main/install.sh
PDG_INSTALL_SHA256=<replace-with-reviewed-64-hex-sha256>
PDG_ENV_FILE=proxy-gateway-plus.example.env
PDG_EXISTING_ACTION=migrate

SIDECAR_ENABLED=1
SIDECAR_SOURCE_URL=https://raw.githubusercontent.com/SchweppesSoda/VPS-Toolkit/main/scripts/po0/proxy-services/vless-raw-enc-argosbx-enhancer.sh
SIDECAR_SOURCE_SHA256=<replace-with-reviewed-64-hex-sha256>
SIDECAR_INSTALL_PATH=/usr/local/sbin/vless-raw-enc-argosbx-enhancer
SIDECAR_EXISTING_ACTION=keep
SIDECAR_RUN_MODE=interactive
