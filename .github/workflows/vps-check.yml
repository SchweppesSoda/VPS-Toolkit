name: Check VPS tools

on:
  push:
    branches: [main]
    paths:
      - scripts/vps/3x-ui/**
      - scripts/vps/xray/**
      - scripts/vps/proxy-stack/**
      - scripts/po0/proxy-services/**
      - tools/vps/**
      - .github/workflows/vps-check.yml
      - .gitattributes
  pull_request:
    paths:
      - scripts/vps/3x-ui/**
      - scripts/vps/xray/**
      - scripts/vps/proxy-stack/**
      - scripts/po0/proxy-services/**
      - tools/vps/**
      - .github/workflows/vps-check.yml
      - .gitattributes
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check existing validation tools
        run: |
          command -v python3 bash zip unzip sha256sum od
      - name: Shell syntax
        run: |
          bash -n scripts/vps/3x-ui/3x-ui-node-exporter.sh
          bash -n scripts/vps/proxy-stack/proxy-stack-orchestrator.sh
          bash -n scripts/po0/proxy-services/vless-raw-enc-argosbx-enhancer.sh
      - name: 3x-ui subscription producer (synthetic SQLite)
        run: python3 tools/vps/test_3x_ui_subscription_exporter.py
      - name: Xray subscription producer (synthetic JSON and RFC 7748 key)
        run: python3 -B tools/vps/test_xray_subscription_exporter.py
      - name: 3x-ui export cleanup (isolated files)
        run: bash tools/vps/test-3x-ui-node-exporter-self-destruct.sh
      - name: Proxy-stack orchestration (mock services and firewall)
        run: bash tools/vps/test-proxy-stack-orchestrator.sh
      - name: Sidecar Xray download (synthetic ZIP; never execute candidate)
        run: python3 tools/vps/test-sidecar-xray-download.py
      - name: Sidecar config application (mock services and isolated state)
        run: python3 tools/vps/test-sidecar-config-apply.py
      - name: Sidecar clock and maintenance (mock host services)
        run: |
          python3 tools/vps/test-sidecar-time-sync.py
          python3 tools/vps/test-sidecar-maintenance.py

  sidecar-real-xray:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch checksum-pinned official Xray for isolated tests
        run: |
          mkdir -p .tmp/xray-test
          curl --fail --location --retry 2 --max-time 120 \
            https://github.com/XTLS/Xray-core/releases/download/v26.3.27/Xray-linux-64.zip \
            -o .tmp/xray-test/xray.zip
          echo '23cd9af937744d97776ee35ecad4972cf4b2109d1e0fe6be9930467608f7c8ae  .tmp/xray-test/xray.zip' | sha256sum -c -
          unzip -j .tmp/xray-test/xray.zip xray -d .tmp/xray-test
          chmod 700 .tmp/xray-test/xray
      - name: Real JSON validation, SS TCP/UDP and VLESS ENC over loopback
        env:
          SIDECAR_XRAY_BIN: ${{ github.workspace }}/.tmp/xray-test/xray
        run: python3 tools/vps/test-sidecar-xray-integration.py

  offline-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Xray and 3x-ui subscription contracts (synthetic data)
        run: |
          python -B tools/vps/test_xray_subscription_exporter.py
          python -B tools/vps/test_3x_ui_subscription_exporter.py
      - name: 3x-ui download (native mock SSH; PowerShell 5.1 and 7)
        shell: powershell
        run: |
          $pythonPath = (Get-Command python.exe -ErrorAction Stop).Source
          & ./tools/vps/test-3x-ui-download.ps1 -PythonPath $pythonPath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
