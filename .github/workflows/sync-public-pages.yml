name: Sync public Pages repository

on:
  push:
    branches:
      - main
    paths:
      - web/**
      - .github/workflows/sync-public-pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-public-pages
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure deploy key
        env:
          PAGES_DEPLOY_KEY: ${{ secrets.PAGES_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          test -n "${PAGES_DEPLOY_KEY}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "${PAGES_DEPLOY_KEY}" > ~/.ssh/pages_deploy_key
          chmod 600 ~/.ssh/pages_deploy_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          cat > ~/.ssh/config <<'EOF'
          Host github.com
            IdentityFile ~/.ssh/pages_deploy_key
            IdentitiesOnly yes
          EOF
          chmod 600 ~/.ssh/config

      - name: Sync web directory
        run: |
          set -euo pipefail
          target_dir="$(mktemp -d)"
          git clone --depth 1 --branch main git@github.com:SchweppesSoda/SchweppesSoda.github.io.git "${target_dir}"
          find "${target_dir}" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a web/. "${target_dir}/"
          touch "${target_dir}/.nojekyll"
          cd "${target_dir}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No public web changes to sync."
            exit 0
          fi
          git commit -m "Sync public web from VPS-Toolkit"
          git push origin main
