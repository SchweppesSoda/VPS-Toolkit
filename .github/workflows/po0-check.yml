name: Check PO0 script assets

on:
  push:
    branches:
      - main
    paths:
      - scripts/po0/relay/**
      - packaging/openwrt/**
      - scripts/po0/nftables/clients/**
      - scripts/po0/nftables/legacy/**
      - scripts/po0/nftables/tools/**
      - scripts/po0/reinstall/**
      - scripts/po0/README.md
      - tools/po0/**
      - .github/workflows/po0-check.yml
      - .github/workflows/po0-release.yml
      - .gitattributes
      - AGENTS.md
      - README.md
      - README.en.md
  pull_request:
    paths:
      - scripts/po0/relay/**
      - packaging/openwrt/**
      - scripts/po0/nftables/clients/**
      - scripts/po0/nftables/legacy/**
      - scripts/po0/nftables/tools/**
      - scripts/po0/reinstall/**
      - scripts/po0/README.md
      - tools/po0/**
      - .github/workflows/po0-check.yml
      - .github/workflows/po0-release.yml
      - .gitattributes
      - AGENTS.md
      - README.md
      - README.en.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build and check PO0 assets
        shell: bash
        run: bash ./tools/po0/check-po0-assets.sh
